name: Process Music Video Master

on:
  workflow_dispatch:
    inputs:
      hero_url:
        description: 'Hero Video YouTube URL'
        required: true
        type: string
      heroine_url:
        description: 'Heroine Video YouTube URL'
        required: true
        type: string
      release_tag:
        description: 'Release Tag (e.g. v1.0-yash-tara)'
        required: true
        default: 'v1.0'

permissions:
  contents: write

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg & yt-dlp
        run: |
          sudo apt update
          sudo apt install ffmpeg -y
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Download Videos
        run: |
          yt-dlp -f "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]/best" --merge-output-format mp4 "${{ github.event.inputs.hero_url }}" -o "hero.mp4"
          yt-dlp -f "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]/best" --merge-output-format mp4 "${{ github.event.inputs.heroine_url }}" -o "heroine.mp4"

      - name: Run Slicer & Master Merge
        run: |
          python3 master_slicer.py

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "Master Video Release - ${{ github.event.inputs.release_tag }}"
          files: final_master_video.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
