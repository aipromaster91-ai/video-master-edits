name: Download, Slice & Release 7 Solo Clips Pairs
name: Download, Slice & Release 7 Pairs x 40 Clips ZIPs

on:
  workflow_dispatch:
    inputs:
      pair_selection:
        description: 'Select pair to process (or select "all" for all 7 pairs)'
        description: 'Select pair to process, or all for all 7 ZIP files'
        required: true
        default: 'all'
        type: choice
          - pair_06_ranveer_kriti
          - pair_07_emraan_kriti
      release_tag:
        description: 'GitHub Release Tag'
        description: 'GitHub Release tag, e.g. v1.0-40-solo-clips'
        required: true
        default: 'v1.0-solo-clips'
        default: 'v1.0-40-solo-clips'
      confirm_rights:
        description: 'I confirm I own/have permission to download/process these videos'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
jobs:
  process-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install FFmpeg & yt-dlp
      - name: Validate permission confirmation
        if: ${{ github.event.inputs.confirm_rights != 'true' }}
        run: |
          sudo apt update
          sudo apt install ffmpeg -y
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          echo "You must confirm you own or have permission to download/process these videos."
          exit 1

      - name: Download Master Videos & Slice Clips
      - name: Install FFmpeg and yt-dlp
        run: |
          python3 -c '
          import os, subprocess, json, sys
          from slice_solo import PAIRS, process_slicing
          sudo apt update
          sudo apt install -y ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version
          ffmpeg -version

          selection = "${{ github.event.inputs.pair_selection }}"
          target_pairs = PAIRS if selection == "all" else [p for p in PAIRS if p["id"] == selection]
      - name: Show configured pair and 40-clip outputs
        run: python3 slice_solo.py --list-pairs --show-clips

          for p in target_pairs:
              print(f"=== Downloading & Slicing: {p[\"name\"]} ===")
              # Download Hero
              if not os.path.exists(p["hero_file"]):
                  print(f"Downloading Hero: {p[\"hero_url\"]}")
                  subprocess.run(["yt-dlp", "-f", "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]/best", "--merge-output-format", "mp4", p["hero_url"], "-o", p["hero_file"]], check=True)
              # Download Heroine
              if not os.path.exists(p["heroine_file"]):
                  print(f"Downloading Heroine: {p[\"heroine_url\"]}")
                  subprocess.run(["yt-dlp", "-f", "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]/best", "--merge-output-format", "mp4", p["heroine_url"], "-o", p["heroine_file"]], check=True)
      - name: Download videos, slice 40 clips per pair, and create ZIPs
        run: python3 slice_solo.py --pair "${{ github.event.inputs.pair_selection }}"

              # Run slicing & zipping
              process_slicing(
                  hero_file=p["hero_file"],
                  heroine_file=p["heroine_file"],
                  output_dir=p["output_dir"],
                  create_zip=True,
                  zip_name=p["zip_name"]
              )
          '
      - name: Upload ZIPs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forty-solo-clips-zips-${{ github.run_id }}
          path: "*.zip"
          if-no-files-found: error
          retention-days: 14

      - name: Upload Zip Files to GitHub Release
      - name: Upload ZIPs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "7 Solo Clip Pairs Release - ${{ github.event.inputs.release_tag }}"
          name: "40 Solo Clips ZIP Release - ${{ github.event.inputs.release_tag }}"
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.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 }}
