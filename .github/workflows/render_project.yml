name: Render Project Master

on:
  workflow_dispatch:
    inputs:
      hero_url:
        description: 'Hero video URL'
        required: true
        type: string
      heroine_url:
        description: 'Heroine video URL'
        required: true
        type: string
      schedule:
        description: 'Clip schedule JSON'
        required: false
        type: string
        default: 'config/schedule_yash_tara.json'
      config:
        description: 'Assemble project config JSON'
        required: false
        type: string
        default: 'config/project_yash_tara.json'
      release_tag:
        description: 'Release tag (e.g. v-yash-tara)'
        required: true
        default: 'v1.0'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (arena branch has the scripts/configs)
        uses: actions/checkout@v4
        with:
          ref: arena/01a02e63-video-master-edits

      - name: Install FFmpeg & yt-dlp
        run: |
          sudo apt update
          sudo apt install -y ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Download Hero & Heroine
        run: |
          yt-dlp -f "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]/best" --merge-output-format mp4 "${{ github.event.inputs.hero_url }}" -o hero.mp4
          yt-dlp -f "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]/best" --merge-output-format mp4 "${{ github.event.inputs.heroine_url }}" -o heroine.mp4

      - name: Slice 36 clips
        run: python3 scripts/slice_clips.py --schedule "${{ github.event.inputs.schedule }}"

      - name: Assemble final (video-only, no audio)
        id: asm
        run: |
          python3 scripts/assemble.py --config "${{ github.event.inputs.config }}"
          OUT=$(python3 -c "import json;print(json.load(open('${{ github.event.inputs.config }}'))['settings']['output']['filename'])")
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "Master - ${{ github.event.inputs.release_tag }}"
          files: ${{ steps.asm.outputs.out }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
